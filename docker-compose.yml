name: expresspass

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - "80:80"
    volumes:
      - ./.docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consign
      POSTGRES_PASSWORD: consign
      POSTGRES_DB: consignments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/postgres/init-authentik.sql:/docker-entrypoint-initdb.d/000_authentik.sql:ro
      - ./apps/api/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consign -d consignments"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "GK111111111111111111111111"
      GARAGE_DEFAULT_SECRET_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      GARAGE_DEFAULT_BUCKET: local-consignments
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./.docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env.example
    volumes:
      - ./apps/api/catalog/pricing-guides:/app/apps/api/catalog/pricing-guides:ro
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://consign:consign@postgres:5432/consignments
      WEB_ORIGIN: http://localhost,http://web.localhost
      OIDC_ISSUER: http://auth.localhost/application/o/expresspass/
      OIDC_JWKS_URL: http://authentik-server:9000/application/o/expresspass/jwks/
      OIDC_AUDIENCE: expresspass
      AWS_REGION: garage
      S3_ENDPOINT: http://garage:3900
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: "GK111111111111111111111111"
      AWS_SECRET_ACCESS_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  gearshift-worker:
    build:
      context: .
      dockerfile: apps/gearshift-worker/Dockerfile
    env_file:
      - apps/api/.env.example
    environment:
      DATABASE_URL: postgres://consign:consign@postgres:5432/consignments
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_OIDC_AUTHORITY: http://auth.localhost/application/o/expresspass/
        VITE_OIDC_CLIENT_ID: expresspass
        VITE_OIDC_REDIRECT_URI: http://localhost/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost
        VITE_OIDC_SCOPE: openid profile email
    depends_on:
      - api

volumes:
  postgres-data:
  garage-data:
  garage-meta:
