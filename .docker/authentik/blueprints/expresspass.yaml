# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Express Pass dev OAuth
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.scopemapping
    id: expresspass-profile-scope
    state: present
    identifiers:
      name: expresspass-profile-scope
    attrs:
      name: expresspass-profile-scope
      scope_name: profile
      description: Express Pass profile claims
      expression: |
        attrs = request.user.group_attributes(request.http_request)
        return {
            "name": request.user.name,
            "preferred_username": request.user.username,
            "given_name": attrs.get("firstName", ""),
            "family_name": attrs.get("lastName", ""),
            "phone_number": attrs.get("phone", ""),
            "address": attrs.get("address", {}),
            "business_name": attrs.get("businessName", ""),
            "gst_number": attrs.get("gstNumber", ""),
            "vendor_id": attrs.get("vendorId"),
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  - model: authentik_providers_oauth2.scopemapping
    id: expresspass-email-scope
    state: present
    identifiers:
      name: expresspass-email-scope
    attrs:
      name: expresspass-email-scope
      scope_name: email
      description: Express Pass email claims
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: expresspass-provider
    state: present
    identifiers:
      name: expresspass-provider
    attrs:
      name: expresspass-provider
      client_type: public
      client_id: expresspass
      redirect_uris:
        - matching_mode: strict
          url: http://localhost/auth/callback
        - matching_mode: strict
          url: http://localhost:3000/auth/callback
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=7
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !KeyOf expresspass-email-scope
        - !KeyOf expresspass-profile-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: expresspass
    attrs:
      name: Express Pass
      slug: expresspass
      provider: !KeyOf expresspass-provider

  - model: authentik_providers_oauth2.oauth2provider
    id: pgadmin-provider
    state: present
    identifiers:
      name: pgadmin-provider
    attrs:
      name: pgadmin-provider
      client_type: public
      client_id: pgadmin
      redirect_uris:
        - matching_mode: strict
          url: http://pgadmin.localhost/oauth2/authorize
        - matching_mode: strict
          url: http://localhost:5050/oauth2/authorize
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=7
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !KeyOf expresspass-email-scope
        - !KeyOf expresspass-profile-scope

  - model: authentik_core.application
    state: present
    identifiers:
      slug: pgadmin
    attrs:
      name: pgAdmin
      slug: pgadmin
      provider: !KeyOf pgadmin-provider

  - model: authentik_core.group
    id: business-group
    state: present
    identifiers:
      name: business
    attrs:
      name: business

  - model: authentik_core.user
    state: present
    identifiers:
      username: customer@example.com
    attrs:
      username: customer@example.com
      name: Dev Customer
      email: customer@example.com
      is_active: true
      password: customer
      attributes:
        firstName: Dev
        lastName: Customer
        phone: "+14035550100"
        address:
          line1: 100 Customer Way
          line2: ""
          city: Calgary
          province: AB
          postalCode: T2P 1A1

  - model: authentik_core.user
    state: present
    identifiers:
      username: business@example.com
    attrs:
      username: business@example.com
      name: Dev Business
      email: business@example.com
      is_active: true
      password: business
      attributes:
        firstName: Dev
        lastName: Business
        phone: "+14035550101"
        address:
          line1: 200 Business Ave
          line2: ""
          city: Calgary
          province: AB
          postalCode: T2P 2B2
        businessName: Dev Business Ltd.
        gstNumber: 123456789RT0001
        vendorId: 1001
      groups:
        - !KeyOf business-group
