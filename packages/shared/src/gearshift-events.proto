syntax = "proto3";

package gearshift.v1;

import "google/protobuf/timestamp.proto";

enum GearshiftEventType {
  GEARSHIFT_EVENT_TYPE_UNSPECIFIED = 0;
  REMOTE_ACCOUNT_LINKED = 1;
  CONSIGNMENT_ACCEPTED = 2;
  ITEM_CHECKED_IN = 3;
  ITEM_CHECKED_OUT = 4;
  ITEM_UPDATED = 5;
  ITEM_SOLD = 6;
  ITEM_NOTE_ADDED = 7;
  CHECK_ISSUED = 8;
  ELECTRONIC_PAYMENT_ISSUED = 9;
}

message GearshiftEventEnvelope {
  string message_id = 1;
  GearshiftEventType event_type = 2;
  uint32 schema_version = 3;
  string source_system = 4;
  string correlation_id = 5;
  string causation_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
  google.protobuf.Timestamp published_at = 8;
  string gearshift_guid = 9;

  oneof payload {
    RemoteAccountLinked remote_account_linked = 100;
    ConsignmentAccepted consignment_accepted = 101;
    ItemCheckedIn item_checked_in = 102;
    ItemCheckedOut item_checked_out = 103;
    ItemUpdated item_updated = 104;
    ItemSold item_sold = 105;
    ItemNoteAdded item_note_added = 106;
    CheckIssued check_issued = 107;
    ElectronicPaymentIssued electronic_payment_issued = 108;
  }
}

message RemoteAccountLinked {
  string remote_account_number = 1;
  string email = 2;
  string gearshift_guid = 3;
  google.protobuf.Timestamp linked_at = 4;
}

message ConsignmentAccepted {
  string consignment_id = 1;
  string gearshift_guid = 2;
  google.protobuf.Timestamp accepted_at = 3;
}

message ItemCheckedIn {
  string consignment_id = 1;
  string item_id = 2;
  string gearshift_item_id = 3;
  int32 quantity = 4;
  google.protobuf.Timestamp checked_in_at = 5;
}

message ItemCheckedOut {
  string consignment_id = 1;
  string item_id = 2;
  string gearshift_item_id = 3;
  int32 quantity = 4;
  google.protobuf.Timestamp checked_out_at = 5;
}

message ItemUpdated {
  GearshiftItemSnapshot item = 1;
}

message ItemSold {
  string consignment_id = 1;
  string item_id = 2;
  string gearshift_item_id = 3;
  int32 quantity = 4;
  int64 sale_amount_cents = 5;
  google.protobuf.Timestamp sold_at = 6;
}

message ItemNoteAdded {
  string consignment_id = 1;
  string item_id = 2;
  string gearshift_item_id = 3;
  ItemNote note = 4;
}

message CheckIssued {
  string payment_id = 1;
  string check_number = 2;
  string gearshift_guid = 3;
  int64 amount_cents = 4;
  google.protobuf.Timestamp issued_at = 5;
  repeated PayoutItem items = 6;
}

message ElectronicPaymentIssued {
  string payment_id = 1;
  string payment_reference = 2;
  string gearshift_guid = 3;
  int64 amount_cents = 4;
  google.protobuf.Timestamp issued_at = 5;
  repeated PayoutItem items = 6;
}

message GearshiftItemSnapshot {
  string id = 1;
  string consignment_id = 2;
  string item_id = 3;
  string barcode = 4;
  string description = 5;
  uint32 item_type = 6;
  string item_type_name = 7;
  string item_size = 8;
  int64 price_cents = 9;
  int32 qty = 10;
  int32 qty_checked = 11;
  int32 sold = 12;
  bool reclaimed = 13;
  int64 value_sold_cents = 14;
  google.protobuf.Timestamp time_sold = 15;
  repeated ItemNote notes = 16;
}

message ItemNote {
  string id = 1;
  string text = 2;
  string type = 3;
  google.protobuf.Timestamp created_at = 4;
}

message PayoutItem {
  string gearshift_item_id = 1;
  string consignment_id = 2;
  string item_id = 3;
}
